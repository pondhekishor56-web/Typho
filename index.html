<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Shared Data</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background: #f4f4f9; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; font-size: 20px; }
        .whatsapp-card { background: #ffffff; border: 1px solid #dcdcdc; border-radius: 8px; padding: 10px; margin-bottom: 15px; display: block; box-shadow: 0 2px 5px rgba(0,0,0,0.08); text-align: left; }
        .whatsapp-card img { width: 100%; height: auto; border-radius: 6px; display: block; margin-bottom: 8px; border: 1px solid #eee; }
        .caption-box { width: 100%; min-height: 35px; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #f8f9fa; box-sizing: border-box; font-weight: bold; margin-bottom: 8px; word-break: break-word; }
        .copy-btn { background: #007BFF; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; width: 100%; }
        .copy-btn:active { background: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Shared Data Preview</h2>
        <div id="contentGallery"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imgsParam = urlParams.get('imgs');
        const textParam = urlParams.get('text');

        const gallery = document.getElementById('contentGallery');

        if (imgsParam) {
            let imageUrls = imgsParam.split(',');
            let texts = textParam ? textParam.split(' | ') : [];

            imageUrls.forEach((url, index) => {
                let card = document.createElement('div');
                card.className = 'whatsapp-card';

                let imgTag = document.createElement('img');
                imgTag.src = url.trim();
                card.appendChild(imgTag);

                let captionBox = document.createElement('div');
                captionBox.className = 'caption-box';
                captionBox.innerText = texts[index] ? texts[index].trim() : "";

                if (captionBox.innerText !== "") {
                    card.appendChild(captionBox);

                    let copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.innerText = '📋 Copy Text';
                    copyBtn.onclick = function() {
                        navigator.clipboard.writeText(captionBox.innerText).then(() => {
                            copyBtn.innerText = '✅ Copied!';
                            setTimeout(() => { copyBtn.innerText = '📋 Copy Text'; }, 2000);
                        });
                    };
                    card.appendChild(copyBtn);
                }

                gallery.appendChild(card);
            });
        } else {
            gallery.innerHTML = "<p>No data found.</p>";
        }
    </script>
</body>
</html>
